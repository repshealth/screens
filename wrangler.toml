name = "store-screen-studio"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

# Briefs are stored in Workers KV. Create the namespace once with:
#   npx wrangler kv namespace create BRIEFS
# then paste the id it prints below.
[[kv_namespaces]]
binding = "BRIEFS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
